name: Zarcillo
options:
  bundleIdPrefix: com.kisnner
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: HQVD2Y42HM
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    # Mayor que la de Clavis: se instala en su lugar sin desinstalarla.
    CURRENT_PROJECT_VERSION: "2609250000"

targets:
  Zarcillo:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - target: ZarcilloWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Zarcillo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Zarcillo busca tu Mac en la red Wi-Fi para controlarlo.
        NSBonjourServices: [_zarcillo._tcp]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Zarcillo escucha la clase para transcribirla en tu Mac, y tus órdenes de voz.
        NSSpeechRecognitionUsageDescription: La transcripción se hace en el propio iPhone, sin internet.
        UIBackgroundModes: [audio, bluetooth-peripheral]
        NSBluetoothAlwaysUsageDescription: Zarcillo se anuncia por Bluetooth para que tu Mac se bloquee cuando te alejas.
        NSUserNotificationsUsageDescription: Zarcillo te avisa si alguien toca tu Mac.
        NSCameraUsageDescription: Zarcillo usa la cámara para leer texto, escanear pizarras o apuntes hacia tu Mac, y para mover el cursor con la mirada.
        NSPhotoLibraryAddUsageDescription: Zarcillo guarda en Fotos el póster de la canción que estás escuchando.
        NSPhotoLibraryUsageDescription: El reloj puede agarrar tu última foto para lanzarla al Mac.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        # Cuenta gratuita: límite de 10 App IDs nuevos por semana. Se reutiliza
        # el par ya registrado de Clavis (iPhone + reloj); cámbialo por
        # com.kisnner.zarcillo cuando se libere.
        PRODUCT_BUNDLE_IDENTIFIER: com.kisnner26.clavis
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ZarcilloMac:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    info:
      path: Mac/Info.plist
      properties:
        CFBundleName: Zarcillo
        CFBundleDisplayName: Zarcillo
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Zarcillo anuncia este Mac en la red Wi-Fi para que tu iPhone lo encuentre.
        NSBonjourServices: [_zarcillo._tcp]
        NSHumanReadableCopyright: © 2026 Kisnner Obando
        NSCameraUsageDescription: Zarcillo usa la cámara del Mac solo para el aviso de postura, sin guardar imágenes, y para fotografiar a quien toque tu Mac si activas el guardián.
        NSAudioCaptureUsageDescription: Zarcillo toma el audio de cada app para darle su propio volumen desde el iPhone. No graba nada.
        NSBluetoothAlwaysUsageDescription: Zarcillo mide la señal de tu iPhone para bloquear el Mac cuando te alejas.
        NSAppleEventsUsageDescription: Zarcillo lee qué suena en Música o Spotify para mostrarlo en tu iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kisnner.zarcillo.mac
        PRODUCT_NAME: Zarcillo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO

  ZarcilloWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared/Shapes.swift
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Zarcillo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.kisnner26.clavis
        WKBackgroundModes: [mindfulness]
        NSMotionUsageDescription: Zarcillo siente el gesto de tu muñeca para lanzar fotos y links entre tu iPhone y tu Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kisnner26.clavis.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
